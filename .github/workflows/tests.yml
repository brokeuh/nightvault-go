# Runs the calculator tests on every push and after the weekly game-data update.
name: Tests

on:
  push:
  workflow_run:
    workflows: ["Update Pokémon GO game data"]
    types: [completed]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/gocalc.test.js
